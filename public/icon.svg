<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#0b3c8f" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Shopping Bag Outline & Handles -->
  <!-- Handle -->
  <path d="M196 170 C196 110, 316 110, 316 170" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  
  <!-- Bag Body -->
  <path d="M120 180 L392 180 L368 410 C366 426, 352 438, 336 438 L176 438 C160 438, 146 426, 144 410 Z" fill="#ffffff" />
  
  <!-- Stylized "AM" geometric monogram inside bag -->
  <!-- 'A' Left & Right wings -->
  <path d="M190 380 L234 235 C238 222, 252 216, 262 222 C266 224, 270 229, 272 235 L316 380" fill="none" stroke="#0052cc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Horizontal crossbar for 'A' merging into 'M' central chevron -->
  <path d="M214 320 L292 320" fill="none" stroke="#0052cc" stroke-width="18" stroke-linecap="round" />
  <!-- Center chevron for 'M' -->
  <path d="M228 270 L256 312 L284 270" fill="none" stroke="#0052cc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Angola Market Star / Sparkle of Trust & Speed -->
  <circle cx="346" cy="216" r="14" fill="#38bdf8" />
  <circle cx="380" cy="180" r="8" fill="#60a5fa" />
</svg>
